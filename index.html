      (function() {
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // fallback gracefully
        }
      })();
    </script>
